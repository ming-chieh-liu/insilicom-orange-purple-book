[project]
name = "orange-purple-book"
version = "0.1.0"
description = "Map FDA drug approvals to the clinical trials that supported them, from FDA bulk data."
requires-python = ">=3.11"
# T0/T1 are stdlib-only: csv, re, datetime, zipfile, io, json, dataclasses.
# Nothing is added without asking; the later parquet and Postgres sources
# (Open Targets, DrugCentral) will need dependencies this env does not have.
dependencies = ["pymongo>=4.6"]

[project.optional-dependencies]
# Mirrored from environment.yml's pip block so `pip install -e .[dev]`
# reproduces the gates outside conda. The conda env stays canonical.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # <3: the repo gates on zero mypy errors, and a major bump changes
    # strictness defaults underneath a passing suite.
    "mypy>=1.10,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "dao", "source", "service", "utility"]

# ---------------------------------------------------------------------------
# Testing (pytest ONLY; all test config lives here per project rules)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# The repo root on sys.path, so `from config.settings import ...` resolves when
# the project is not pip-installed into the env. The conda env is shared with
# another project and carries no editable install of this one.
pythonpath = ["."]
# The packages are in testpaths so --doctest-modules collects their doctests.
# A doctest that is never executed is documentation, not a contract.
testpaths = ["tests", "config", "dao", "source", "service", "utility"]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-modules",
    "--cov=config",
    "--cov=dao",
    "--cov=source",
    "--cov=service",
    "--cov=utility",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "realdata: reads fda_raw/; skipped automatically when the tree is absent",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
# tests/ is deliberately NOT excluded: house style requires annotated tests,
# and excluding them would check nothing.
#
# scratch/ holds superseded one-off probes, kept on disk for reference and
# gitignored. It is not one of this project's packages ([tool.setuptools]
# packages above is the list), and .gitignore does not reach mypy, so the
# directory has to be named here.
exclude = ["scratch/"]
